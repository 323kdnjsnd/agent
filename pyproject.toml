[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-mining-daily-agent"
version = "0.1.0"
description = "A production-minded MCP mining rights daily brief agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.8.0,<2",
  "pydantic>=2.8.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.0",
]

[project.scripts]
mining-daily = "mcp_agent.agent.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agent"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
